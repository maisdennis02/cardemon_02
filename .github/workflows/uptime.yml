# Free uptime monitoring: GitHub emails the repo owner when a run fails.
# Two separate jobs so the alert email says which layer broke:
#  - menu-pages: the customer-facing path (must stay up even during DB outages,
#    served from the ISR cache) — every 15 min; these hit the ISR cache only,
#    so they never wake the database
#  - database: /api/health returns 503 when Postgres is unreachable — hourly,
#    NOT every 15 min: each probe wakes the Neon compute (autosuspend is 5 min),
#    and a 15-min cadence alone burns ~60 of the free plan's 100 CU-hours/month
# Each probe retries 3x over ~40s to avoid alerting on transient blips.
# Note: GitHub pauses scheduled workflows in public repos after 60 days without
# repo activity (it emails a warning first) — any commit re-enables it.
#
# This is a BACKUP monitor: GitHub heavily deprioritizes cron on free public
# repos (runs get skipped or cancelled with "not acquired by Runner" — that
# email means GitHub hiccupped, NOT that the site is down; a real outage email
# says "DOWN: <url>"). Primary monitoring should be an external service like
# UptimeRobot pointed at the same URLs.
name: uptime

on:
  schedule:
    # Each job is gated on github.event.schedule so it only runs for its own
    # cron entry (at :00 both entries fire as separate runs).
    - cron: "*/15 * * * *" # menu-pages
    - cron: "0 * * * *" # database
  workflow_dispatch:

jobs:
  menu-pages:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Probe public menu and homepage
        run: |
          probe() {
            local url="$1"
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$url" || echo 000)
              if [ "$code" = "200" ]; then echo "OK $url (attempt $i)"; return 0; fi
              echo "attempt $i: HTTP $code for $url"
              sleep 20
            done
            echo "::error::DOWN: $url (last status $code)"
            return 1
          }
          probe "https://menulala.com/m/cavalo-marinho"
          probe "https://menulala.com/"

  database:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Probe /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "https://menulala.com/api/health" || echo 000)
            if [ "$code" = "200" ]; then echo "OK (attempt $i)"; exit 0; fi
            echo "attempt $i: HTTP $code"
            sleep 20
          done
          echo "::error::DOWN: database unreachable via /api/health (last status $code)"
          exit 1
